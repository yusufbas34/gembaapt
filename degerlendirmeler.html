<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Değerlendirmeler – GembaGPT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2f4f8;--card:#fff;--text1:#1a1d23;--text2:#6b7280;--text3:#9ca3af;
  --acc:#1a1a18;--bd:#e5e7eb;--bd2:#d1d5db;--green:#16a34a;--red:#dc2626;
  --yellow:#ca8a04;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#12141a;--card:#1e2028;--text1:#e8eaf0;--text2:#9ca3af;--text3:#6b7280;--bd:#2d3040;--bd2:#3a3e52;}
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;padding:20px 16px 80px;}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.hdr-icon{width:36px;height:36px;background:#1a1a18;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.hdr h1{font-size:19px;font-weight:700;letter-spacing:-.4px;}
.hdr .sub{font-size:12px;color:var(--text2);}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
input[type=text],input[type=password],input[type=number],select{
  width:100%;padding:10px 12px;border:1.5px solid var(--bd2);border-radius:8px;
  font-family:inherit;font-size:14px;background:var(--card);color:var(--text1);
  outline:none;transition:border .15s;
}
input:focus,select:focus{border-color:var(--acc);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.btn:active{opacity:.8;}
.bp{background:#1a1a18;color:#fff;width:100%;margin-top:12px;}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:16px;}
#loginBox{max-width:400px;margin:0 auto;}
#mainBox{display:none;}

/* Filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(min-width:600px){.filters{grid-template-columns:repeat(4,1fr);}}
.filter-full{grid-column:1/-1;}
.filter-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px;}
.filter-row>*{flex:1;}
.filter-btn{background:transparent;border:1.5px solid var(--bd2);border-radius:8px;padding:10px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.filter-btn.act{background:#1a1a18;border-color:#1a1a18;color:#fff;}

/* Combobox (aramalı, çoklu seçim) */
.cbx{position:relative;}
.cbx-btn{
  width:100%;display:flex;align-items:center;gap:6px;text-align:left;
  padding:10px 12px;border:1.5px solid var(--bd2);border-radius:8px;
  background:var(--card);color:var(--text1);font-family:inherit;font-size:14px;
  cursor:pointer;transition:border .15s;
}
.cbx-btn:hover{border-color:var(--acc);}
.cbx.open .cbx-btn{border-color:var(--acc);}
.cbx-btn .cbx-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbx-btn .cbx-txt.ph{color:var(--text3);}
.cbx-btn .cbx-n{background:var(--acc);color:#fff;border-radius:100px;font-size:11px;font-weight:700;padding:1px 7px;flex-shrink:0;}
.cbx-btn .cbx-car{color:var(--text3);font-size:10px;flex-shrink:0;}
.cbx-pop{
  display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;
  background:var(--card);border:1.5px solid var(--bd2);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:hidden;
}
.cbx.open .cbx-pop{display:block;}
.cbx-search{padding:8px;border-bottom:1px solid var(--bd);}
.cbx-search input{width:100%;padding:8px 10px;font-size:13px;border:1.5px solid var(--bd2);border-radius:7px;background:var(--bg);color:var(--text1);font-family:inherit;outline:none;}
.cbx-search input:focus{border-color:var(--acc);}
.cbx-list{max-height:230px;overflow-y:auto;}
.cbx-opt{
  display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:13px;
  cursor:pointer;border-bottom:1px solid var(--bd);
}
.cbx-opt:last-child{border-bottom:none;}
.cbx-opt:hover{background:var(--bg);}
.cbx-box{
  width:16px;height:16px;border:1.5px solid var(--bd2);border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
}
.cbx-opt.sel .cbx-box{background:var(--acc);border-color:var(--acc);}
.cbx-opt .cbx-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbx-opt .cbx-cnt{font-size:11px;color:var(--text3);flex-shrink:0;}
.cbx-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);}
.cbx-foot button{flex:1;padding:7px;font-size:12px;font-weight:600;font-family:inherit;border-radius:7px;border:1.5px solid var(--bd2);background:transparent;color:var(--text2);cursor:pointer;}
.cbx-foot button:hover{border-color:var(--acc);color:var(--text1);}
.cbx-none{padding:16px 12px;text-align:center;font-size:12px;color:var(--text3);}

/* Seçili filtre etiketleri */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip-row:empty{display:none;}
.fchip{
  display:inline-flex;align-items:center;gap:6px;background:var(--bg);
  border:1px solid var(--bd2);border-radius:100px;padding:4px 6px 4px 11px;font-size:12px;
}
.fchip b{font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;}
.fchip button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;}
.fchip button:hover{color:var(--red);}

/* Stats row */
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:80px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 12px;text-align:center;}
.stat-val{font-size:22px;font-weight:700;line-height:1;}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:4px;}

/* Table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th{text-align:left;padding:9px 10px;color:var(--text2);font-weight:600;border-bottom:1.5px solid var(--bd);cursor:pointer;white-space:nowrap;user-select:none;}
th:hover{color:var(--text1);}
th .arr{font-size:10px;margin-left:3px;opacity:.5;}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}
.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.bg-green{background:#dcfce7;color:#15803d;}
.bg-yellow{background:#fef9c3;color:#854d0e;}
.bg-red{background:#fee2e2;color:#991b1b;}
.bg-gray{background:#f3f4f6;color:#6b7280;}
.score-pill{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:700;border:2px solid currentColor;}
.score-hi{color:#15803d;border-color:#86efac;}
.score-mid{color:#b45309;border-color:#fcd34d;}
.score-lo{color:#991b1b;border-color:#fca5a5;}
.score-none{color:var(--text3);border-color:var(--bd2);font-size:11px;}
.empty{text-align:center;padding:40px 20px;color:var(--text2);}
.empty-icon{font-size:36px;margin-bottom:10px;}

/* Search */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{padding-left:36px;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none;}

/* Pagination */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
.pager-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--bd2);background:none;font-family:inherit;font-size:13px;cursor:pointer;color:var(--text2);}
.pager-btn.act{background:#1a1a18;border-color:#1a1a18;color:#fff;}
.pager-btn:disabled{opacity:.4;cursor:default;}
.pager-info{font-size:12px;color:var(--text2);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:999;}
.toast.show{opacity:1;}
.refresh-btn{background:transparent;border:1.5px solid var(--bd2);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:5px;}
.refresh-btn:hover{border-color:#1a1a18;color:#1a1a18;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.top-bar h2{font-size:16px;font-weight:700;}
</style>
</head>
<body>

<div id="loginBox">
  <div class="hdr" style="margin-bottom:24px;">
    <div class="hdr-icon">📊</div>
    <div><div class="hdr h1" style="font-size:18px;font-weight:700;">Değerlendirmeler</div><div class="sub">Mağaza ziyaret geri bildirimleri</div></div>
  </div>
  <div class="card">
    <div style="margin-bottom:14px">
      <label>Ad Soyad</label>
      <input type="text" id="lName" placeholder="Adınız Soyadınız" autocomplete="name">
    </div>
    <div>
      <label>PIN</label>
      <input type="password" id="lPin" placeholder="••••" inputmode="numeric" maxlength="6">
    </div>
    <div class="err" id="lErr"></div>
    <button class="btn bp" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<div id="mainBox">
  <div class="hdr">
    <div class="hdr-icon">📊</div>
    <div>
      <div style="font-size:18px;font-weight:700;">Değerlendirmeler</div>
      <div style="font-size:12px;color:var(--text2);" id="loggedAs"></div>
    </div>
    <div style="margin-left:auto;">
      <button class="refresh-btn" onclick="loadData()">↻ Yenile</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsRow">
    <div class="stat"><div class="stat-val" id="sTotalNote">—</div><div class="stat-lbl">Geri Bildirim</div></div>
    <div class="stat"><div class="stat-val" id="sStores">—</div><div class="stat-lbl">Mağaza</div></div>
    <div class="stat"><div class="stat-val" id="sMags">—</div><div class="stat-lbl">MAG</div></div>
    <div class="stat"><div class="stat-val" id="sUsers">—</div><div class="stat-lbl">Kullanıcı</div></div>
  </div>

  <!-- Filters -->
  <div class="card">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="fSearch" placeholder="Geri bildirim metni, mağaza veya kullanıcı ara…" oninput="applyFilters()">
    </div>

    <div class="filters" id="filterGrid"></div>

    <div id="chipRow" class="chip-row"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="filter-btn" onclick="clearFilters()">✕ Filtreleri Temizle</button>
      <button class="filter-btn" onclick="exportExcel()" style="border-color:var(--green);color:var(--green)">⬇ Excel'e Aktar</button>
      <span id="resultCount" style="font-size:12px;color:var(--text2);display:flex;align-items:center;"></span>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="top-bar">
      <h2>Geri Bildirimler</h2>
    </div>
    <div class="tbl-wrap">
      <table id="visitTable">
        <thead>
          <tr>
            <th onclick="sortBy('date')">Tarih <span class="arr" id="arr-date"></span></th>
            <th onclick="sortBy('week')">Hf <span class="arr" id="arr-week"></span></th>
            <th onclick="sortBy('mag')">MAG <span class="arr" id="arr-mag"></span></th>
            <th onclick="sortBy('bg')">Buyer Grup <span class="arr" id="arr-bg"></span></th>
            <th onclick="sortBy('kl')">Klasman <span class="arr" id="arr-kl"></span></th>
            <th>Geri Bildirim</th>
            <th onclick="sortBy('store')">Mağaza <span class="arr" id="arr-store"></span></th>
            <th onclick="sortBy('user')">Kullanıcı <span class="arr" id="arr-user"></span></th>
          </tr>
        </thead>
        <tbody id="visitBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
      <div class="empty-icon">📋</div>
      <div>Kayıt bulunamadı</div>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL_VISITS = [];
var ROWS = [];
var FILTERED = [];
var PAGE = 1;
var PAGE_SIZE = 25;
var SORT_KEY = 'date';
var SORT_ASC = false;
var AUTH = null;

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2200);
}

function doLogin(){
  var name=document.getElementById('lName').value.trim();
  var pin=document.getElementById('lPin').value.trim();
  if(!name||!pin){document.getElementById('lErr').textContent='Ad ve PIN gerekli.';return;}
  document.getElementById('lErr').textContent='';

  // Önce gemba_auth'dan dene
  var stored=null;
  try{stored=JSON.parse(localStorage.getItem('gemba_auth')||'null');}catch(e){}
  if(stored&&stored.name&&stored.pin){
    name=stored.name; pin=stored.pin;
    document.getElementById('lName').value=name;
    document.getElementById('lPin').value=pin;
  }

  fetch('/ratings/all',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name,pin:pin})
  }).then(function(r){return r.json();}).then(function(d){
    if(d&&d.ok){
      AUTH={name:name,pin:pin};
      document.getElementById('loginBox').style.display='none';
      document.getElementById('mainBox').style.display='block';
      document.getElementById('loggedAs').textContent=name+' olarak giriş yapıldı';
      ALL_VISITS=d.visits||[];
      buildRows();
      buildFilterOptions();
      applyFilters();
    } else {
      document.getElementById('lErr').textContent='PIN hatalı veya kullanıcı bulunamadı.';
    }
  }).catch(function(){
    document.getElementById('lErr').textContent='Sunucuya ulaşılamadı.';
  });
}

function loadData(){
  if(!AUTH) return;
  fetch('/ratings/all',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:AUTH.name,pin:AUTH.pin})
  }).then(function(r){return r.json();}).then(function(d){
    if(d&&d.ok){
      ALL_VISITS=d.visits||[];
      buildRows();
      buildFilterOptions();
      applyFilters();
      toast('✓ Güncellendi');
    }
  }).catch(function(){toast('Bağlantı hatası');});
}

// Ziyaretleri tek tek geri bildirim satırlarına düzleştir
function buildRows(){
  ROWS=[];
  ALL_VISITS.forEach(function(v){
    (v.notes||[]).forEach(function(n){
      (String(n.tx||'').split('\n')).forEach(function(line){
        var t=line.trim();
        if(!t) return;
        ROWS.push({
          id:v.id, date:v.date||'', week:v.week||'', user:v.user||'',
          store:v.store||'', reyon:v.reyon||'',
          mag:n.mag||'', bg:n.bg||'', kl:n.kl||'', tx:t
        });
      });
    });
  });
}

// ═══ FİLTRE TANIMLARI ═══
var FIELDS=[
  {key:'week',  label:'Hafta',      num:true},
  {key:'mag',   label:'MAG'},
  {key:'bg',    label:'Buyer Grup'},
  {key:'kl',    label:'Klasman'},
  {key:'store', label:'Mağaza'},
  {key:'user',  label:'Kullanıcı'}
];
var FILT={week:[],mag:[],bg:[],kl:[],store:[],user:[]};
var CBX_SEARCH={};
var OPEN_KEY=null;

function buildFilterOptions(){
  var grid=document.getElementById('filterGrid');
  grid.innerHTML=FIELDS.map(function(f){
    return '<div><label>'+f.label+'</label>'
      +'<div class="cbx" id="cbx-'+f.key+'">'
      +'<button type="button" class="cbx-btn" onclick="cbxToggle(\''+f.key+'\')">'
      +'<span class="cbx-txt ph" id="cbxtxt-'+f.key+'">Tümü</span>'
      +'<span class="cbx-car">▼</span></button>'
      +'<div class="cbx-pop">'
      +'<div class="cbx-search"><input type="text" id="cbxq-'+f.key+'" placeholder="Ara…" oninput="cbxSearch(\''+f.key+'\',this.value)"></div>'
      +'<div class="cbx-list" id="cbxlist-'+f.key+'"></div>'
      +'<div class="cbx-foot">'
      +'<button type="button" onclick="cbxClear(\''+f.key+'\')">Temizle</button>'
      +'<button type="button" onclick="cbxClose()">Kapat</button>'
      +'</div></div></div></div>';
  }).join('');
  OPEN_KEY=null;
  refreshAllLabels();
}

// Bir alanın seçenekleri, DİĞER tüm filtreler uygulandıktan sonra
// kalan satırlardan üretilir. Böylece MAG seçilince yalnızca ona ait
// buyer gruplar, buyer grup seçilince ona ait klasmanlar listelenir.
function rowMatches(r, exceptKey){
  for(var i=0;i<FIELDS.length;i++){
    var k=FIELDS[i].key;
    if(k===exceptKey) continue;
    var sel=FILT[k];
    if(sel.length && sel.indexOf(String(r[k]))<0) return false;
  }
  return true;
}

function optionsFor(key){
  var f=FIELDS.filter(function(x){return x.key===key;})[0];
  var counts={};
  ROWS.forEach(function(r){
    if(!r[key]) return;
    if(!rowMatches(r,key)) return;
    var v=String(r[key]);
    counts[v]=(counts[v]||0)+1;
  });
  // Seçili olanlar listede kalsın (sayı 0 olsa bile)
  FILT[key].forEach(function(v){ if(!(v in counts)) counts[v]=0; });
  var arr=Object.keys(counts);
  arr.sort(f&&f.num
    ? function(a,b){return Number(b)-Number(a);}
    : function(a,b){return a.localeCompare(b,'tr');});
  return arr.map(function(v){return {val:v,count:counts[v]};});
}

function cbxRender(key){
  var list=document.getElementById('cbxlist-'+key);
  if(!list) return;
  var q=(CBX_SEARCH[key]||'').toLowerCase().trim();
  var opts=optionsFor(key).filter(function(o){
    return !q || o.val.toLowerCase().indexOf(q)>=0;
  });
  if(!opts.length){ list.innerHTML='<div class="cbx-none">Sonuç yok</div>'; return; }
  list.innerHTML=opts.map(function(o){
    var sel=FILT[key].indexOf(o.val)>=0;
    return '<div class="cbx-opt'+(sel?' sel':'')+'" onclick="cbxPick(\''+key+'\',this.dataset.v)" data-v="'+escAttr(o.val)+'">'
      +'<span class="cbx-box">'+(sel?'✓':'')+'</span>'
      +'<span class="cbx-lbl">'+escHtml(o.val)+'</span>'
      +'<span class="cbx-cnt">'+o.count+'</span></div>';
  }).join('');
}

function cbxLabel(key){
  var txt=document.getElementById('cbxtxt-'+key);
  var btn=txt&&txt.parentNode;
  if(!txt) return;
  var sel=FILT[key];
  var old=btn.querySelector('.cbx-n');
  if(old) old.remove();
  if(!sel.length){ txt.textContent='Tümü'; txt.className='cbx-txt ph'; return; }
  txt.className='cbx-txt';
  txt.textContent=sel.length===1?sel[0]:sel.join(', ');
  if(sel.length>1){
    var n=document.createElement('span');
    n.className='cbx-n'; n.textContent=sel.length;
    btn.insertBefore(n, btn.querySelector('.cbx-car'));
  }
}

function cbxToggle(key){
  if(OPEN_KEY===key){ cbxClose(); return; }
  cbxClose();
  OPEN_KEY=key;
  var el=document.getElementById('cbx-'+key);
  if(el) el.classList.add('open');
  CBX_SEARCH[key]='';
  var q=document.getElementById('cbxq-'+key);
  if(q){ q.value=''; setTimeout(function(){q.focus();},30); }
  cbxRender(key);
}

function cbxClose(){
  if(!OPEN_KEY) return;
  var el=document.getElementById('cbx-'+OPEN_KEY);
  if(el) el.classList.remove('open');
  OPEN_KEY=null;
}

function cbxSearch(key,val){ CBX_SEARCH[key]=val; cbxRender(key); }

function cbxPick(key,val){
  var i=FILT[key].indexOf(val);
  if(i>=0) FILT[key].splice(i,1);
  else FILT[key].push(val);
  cbxRender(key);
  cbxLabel(key);
  applyFilters();
}

function cbxClear(key){
  FILT[key]=[];
  cbxRender(key);
  cbxLabel(key);
  applyFilters();
}

function removeChip(key,val){
  var i=FILT[key].indexOf(val);
  if(i>=0) FILT[key].splice(i,1);
  cbxLabel(key);
  applyFilters();
}

function renderChips(){
  var row=document.getElementById('chipRow');
  var html='';
  FIELDS.forEach(function(f){
    FILT[f.key].forEach(function(v){
      html+='<span class="fchip"><b>'+f.label+'</b> '+escHtml(v)
        +'<button onclick="removeChip(\''+f.key+'\',this.dataset.v)" data-v="'+escAttr(v)+'" title="Kaldır">✕</button></span>';
    });
  });
  row.innerHTML=html;
}

function refreshAllLabels(){
  FIELDS.forEach(function(f){ cbxLabel(f.key); });
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function applyFilters(){
  var search=(document.getElementById('fSearch').value||'').toLowerCase().trim();

  FILTERED=ROWS.filter(function(r){
    if(search&&!(
      (r.tx||'').toLowerCase().includes(search)||
      (r.store||'').toLowerCase().includes(search)||
      (r.user||'').toLowerCase().includes(search)
    )) return false;
    return rowMatches(r,null);
  });

  renderChips();
  if(OPEN_KEY) cbxRender(OPEN_KEY);

  FILTERED.sort(function(a,b){
    var av=a[SORT_KEY]||'',bv=b[SORT_KEY]||'';
    if(SORT_KEY==='week'){av=a.week||0;bv=b.week||0;}
    if(SORT_KEY==='date'){av=a.id||0;bv=b.id||0;}
    if(av<bv) return SORT_ASC?-1:1;
    if(av>bv) return SORT_ASC?1:-1;
    return 0;
  });

  PAGE=1;
  updateStats();
  renderTable();
}

function sortBy(key){
  if(SORT_KEY===key) SORT_ASC=!SORT_ASC;
  else{SORT_KEY=key;SORT_ASC=false;}
  ['date','week','mag','bg','kl','store','user'].forEach(function(k){
    var el=document.getElementById('arr-'+k);
    if(el) el.textContent=k===SORT_KEY?(SORT_ASC?'↑':'↓'):'';
  });
  applyFilters();
}

function updateStats(){
  var stores=new Set(),mags=new Set(),users=new Set();
  FILTERED.forEach(function(r){
    if(r.store) stores.add(r.store);
    if(r.mag) mags.add(r.mag);
    if(r.user) users.add(r.user);
  });

  document.getElementById('sTotalNote').textContent=FILTERED.length;
  document.getElementById('sStores').textContent=stores.size;
  document.getElementById('sMags').textContent=mags.size;
  document.getElementById('sUsers').textContent=users.size;
  document.getElementById('resultCount').textContent=
    FILTERED.length===ROWS.length?FILTERED.length+' geri bildirim'
    :FILTERED.length+' / '+ROWS.length+' geri bildirim';
}

function renderTable(){
  var tbody=document.getElementById('visitBody');
  var empty=document.getElementById('emptyState');
  var start=(PAGE-1)*PAGE_SIZE;
  var page=FILTERED.slice(start, start+PAGE_SIZE);

  if(!FILTERED.length){
    tbody.innerHTML='';
    empty.style.display='block';
    document.getElementById('pager').innerHTML='';
    return;
  }
  empty.style.display='none';

  tbody.innerHTML=page.map(function(r){
    return '<tr>'
      +'<td style="white-space:nowrap;font-size:12px;color:var(--text2)">'+escHtml(r.date)+'</td>'
      +'<td style="text-align:center;color:var(--text2)">'+escHtml(String(r.week))+'</td>'
      +'<td>'+(r.mag?'<span class="badge bg-gray">'+escHtml(r.mag)+'</span>':'')+'</td>'
      +'<td style="font-size:12px">'+escHtml(r.bg)+'</td>'
      +'<td style="font-size:12px;color:var(--text2)">'+escHtml(r.kl)+'</td>'
      +'<td style="min-width:240px">'+escHtml(r.tx)+'</td>'
      +'<td style="font-size:12px">'+escHtml(r.store)+'</td>'
      +'<td style="font-size:12px;font-weight:600">'+escHtml(r.user)+'</td>'
      +'</tr>';
  }).join('');

  renderPager();
}

function renderPager(){
  var total=Math.ceil(FILTERED.length/PAGE_SIZE);
  if(total<=1){document.getElementById('pager').innerHTML='';return;}
  var html='<button class="pager-btn" onclick="goPage('+(PAGE-1)+')" '+(PAGE<=1?'disabled':'')+'>‹</button>';
  var start=Math.max(1,PAGE-2), end=Math.min(total,start+4);
  for(var i=start;i<=end;i++){
    html+='<button class="pager-btn'+(i===PAGE?' act':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  }
  html+='<button class="pager-btn" onclick="goPage('+(PAGE+1)+')" '+(PAGE>=total?'disabled':'')+'>›</button>';
  html+='<span class="pager-info">'+PAGE+' / '+total+'</span>';
  document.getElementById('pager').innerHTML=html;
}

function goPage(n){
  var total=Math.ceil(FILTERED.length/PAGE_SIZE);
  if(n<1||n>total) return;
  PAGE=n;
  renderTable();
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearFilters(){
  document.getElementById('fSearch').value='';
  FIELDS.forEach(function(f){ FILT[f.key]=[]; });
  cbxClose();
  refreshAllLabels();
  applyFilters();
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Süzülmüş kayıtları Excel'de açılabilir CSV olarak indir
function exportExcel(){
  if(!FILTERED.length){ toast('Aktarılacak kayıt yok'); return; }
  var cols=[
    ['Tarih','date'],['Hafta','week'],['MAG','mag'],['Buyer Grup','bg'],
    ['Klasman','kl'],['Geri Bildirim','tx'],['Mağaza','store'],['Kullanıcı','user']
  ];
  // Excel TR: ayraç olarak ; kullanır
  function cell(v){
    var s=(v===null||v===undefined)?'':String(v);
    s=s.replace(/"/g,'""');
    return '"'+s+'"';
  }
  var lines=[cols.map(function(c){return cell(c[0]);}).join(';')];
  FILTERED.forEach(function(r){
    lines.push(cols.map(function(c){return cell(r[c[1]]);}).join(';'));
  });
  // BOM — Excel'in UTF-8'i (Türkçe karakterler) doğru okuması için
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var d=new Date();
  var pad=function(n){return n<10?'0'+n:''+n;};
  var name='gemba-geri-bildirimler-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())
    +'-'+pad(d.getHours())+pad(d.getMinutes())+'.csv';
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('✓ '+FILTERED.length+' kayıt indirildi');
}

// Dışarı tıklayınca açık dropdown'ı kapat
document.addEventListener('click',function(e){
  if(!OPEN_KEY) return;
  var el=document.getElementById('cbx-'+OPEN_KEY);
  if(el&&!el.contains(e.target)) cbxClose();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') cbxClose();
});

// Enter tuşu
document.getElementById('lPin').addEventListener('keydown',function(e){if(e.key==='Enter') doLogin();});
document.getElementById('lName').addEventListener('keydown',function(e){if(e.key==='Enter') document.getElementById('lPin').focus();});

// Kaydedilmiş oturum varsa otomatik doldur
(function(){
  try{
    var a=JSON.parse(localStorage.getItem('gemba_auth')||'null');
    if(a&&a.name) document.getElementById('lName').value=a.name;
  }catch(e){}
})();
</script>
